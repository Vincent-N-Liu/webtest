<script>
  const STORAGE_KEY = 'guestbook_messages';

  function getMessages() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveMessages(msgs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
  }

  function formatTime(isoStr) {
    const d = new Date(isoStr);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function avatarLetter(name) {
    return name.trim().charAt(0).toUpperCase() || '?';
  }

  function renderMessages() {
    const container = document.getElementById('gb-messages');
    const msgs = getMessages();

    if (msgs.length === 0) {
      container.innerHTML = '<div class="gb-empty">目前還沒有留言，快來第一個留言吧！</div>';
      return;
    }

    container.innerHTML = msgs.slice().reverse().map((m, i) => {
      const realIndex = msgs.length - 1 - i;
      return `
        <div class="gb-message-item">
          <button class="gb-delete-btn" onclick="deleteMessage(${realIndex})" title="刪除此留言">×</button>
          <div class="gb-message-header">
            <div class="gb-avatar">${avatarLetter(m.name)}</div>
            <div>
              <div class="gb-name">${escapeHtml(m.name)}</div>
              <div class="gb-time">${formatTime(m.time)}</div>
            </div>
          </div>
          <div class="gb-content">${escapeHtml(m.content)}</div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function submitMessage() {
    const nameEl = document.getElementById('gb-name');
    const contentEl = document.getElementById('gb-content');
    const nameNotice = document.getElementById('gb-name-notice');
    const contentNotice = document.getElementById('gb-content-notice');

    const name = nameEl.value.trim();
    const content = contentEl.value.trim();

    let valid = true;
    if (!name) { nameNotice.style.display = 'block'; valid = false; }
    else { nameNotice.style.display = 'none'; }
    if (!content) { contentNotice.style.display = 'block'; valid = false; }
    else { contentNotice.style.display = 'none'; }
    if (!valid) return;

    const msgs = getMessages();
    msgs.push({ name, content, time: new Date().toISOString() });
    saveMessages(msgs);

    nameEl.value = '';
    contentEl.value = '';
    renderMessages();
  }

  function deleteMessage(index) {
    if (!confirm('確定要刪除這則留言嗎？')) return;
    const msgs = getMessages();
    msgs.splice(index, 1);
    saveMessages(msgs);
    renderMessages();
  }

  // 初始化
  renderMessages();
</script>

              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
